name: build-firmware

on:
  push:
    # 只对分支推送触发。tag 推送交给 release.yml，
    # 否则发一次版本会把同一份固件编两遍（分支一次 + tag 一次）。
    branches:
      - "**"
    paths-ignore:
      - "doc/**"
      - "design/**"
      - "service/**"
      - "**/*.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# 同一分支连续推送时取消上一次未完成的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Svelte web
        run: |
          cd web
          npm install
          npm run build

      - name: Build firmware (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware

      - name: Generate SPIFFS image
        run: |
          # esp-idf-ci-action 在独立容器里跑，IDF_PATH 不会留到后续 step，这里按版本下载打包脚本
          curl -fsSL -o spiffsgen.py \
            https://raw.githubusercontent.com/espressif/esp-idf/v5.5.1/components/spiffs/spiffsgen.py
          # 固件读的是 /spiffs/www/<file>，所以 dist 必须放进 www/ 子目录
          rm -rf spiffs_tmp
          mkdir -p spiffs_tmp/www
          cp -r web/dist/. spiffs_tmp/www/
          python3 spiffsgen.py 0x7E0000 spiffs_tmp spiffs.bin
          ls -l spiffs.bin

      - name: Merge flash image
        run: |
          python3 -m pip install --quiet esptool
          python3 -m esptool --chip esp32s3 merge_bin -o deskwong-merged.bin \
            0x0 firmware/build/bootloader/bootloader.bin \
            0x8000 firmware/build/partition_table/partition-table.bin \
            0xf000 firmware/build/ota_data_initial.bin \
            0x20000 firmware/build/deskwong.bin \
            0x820000 spiffs.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskwong-firmware
          path: |
            deskwong-merged.bin
            firmware/build/deskwong.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            spiffs.bin
