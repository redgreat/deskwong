name: Release Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - name: Test service
        shell: pwsh
        run: ./test/run.ps1 -ServiceOnly

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Resolve Quay image
        id: quay
        shell: bash
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: |
          namespace="${QUAY_USERNAME%%+*}"
          test -n "$namespace"
          echo "image=quay.io/$namespace/deskwong" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.quay.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Resolve release values
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR and Quay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.release.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # 编译可刷机固件并作为 Release 资产上传（tag 推送时才执行）
  build-firmware:
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Svelte web
        run: |
          cd web
          npm install
          npm run build

      - name: Build firmware (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware

      - name: Generate SPIFFS image
        run: |
          curl -fsSL -o spiffsgen.py \
            https://raw.githubusercontent.com/espressif/esp-idf/v5.5.1/components/spiffs/spiffsgen.py
          rm -rf spiffs_tmp
          mkdir -p spiffs_tmp/www
          cp -r web/dist/. spiffs_tmp/www/
          python3 spiffsgen.py 0x7E0000 spiffs_tmp spiffs.bin

      - name: Merge flash image
        run: |
          python3 -m pip install --quiet esptool
          python3 -m esptool --chip esp32s3 merge_bin -o "deskwong-merged-${GITHUB_REF_NAME}.bin" \
            0x0 firmware/build/bootloader/bootloader.bin \
            0x8000 firmware/build/partition_table/partition-table.bin \
            0xf000 firmware/build/ota_data_initial.bin \
            0x20000 firmware/build/deskwong.bin \
            0x820000 spiffs.bin
          cp firmware/build/deskwong.bin "deskwong-app-${GITHUB_REF_NAME}.bin"
          ls -l deskwong-*.bin spiffs.bin

      - name: Attach firmware to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deskwong-merged-${{ github.ref_name }}.bin
            deskwong-app-${{ github.ref_name }}.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            spiffs.bin
