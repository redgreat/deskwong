services:
  deskwong-service:
    image: ghcr.io/redgreat/deskwong:latest
    container_name: deskwong-service
    hostname: deskwong-service
    restart: unless-stopped
    pull_policy: always
    environment:
      TZ: Asia/Shanghai
      DESKWONG_LOG_LEVEL: "info"
      # 生产环境建议设置为 32 字节密钥的 Base64；未设置时会在数据卷生成 settings.sqlite.key。
      DESKWONG_SETTINGS_KEY: "${DESKWONG_SETTINGS_KEY:-}"
      DESKWONG_CODEX_AUTH_FILE: "/home/nonroot/.codex/auth.json"
      HTTPS_PROXY: "http://host.docker.internal:7890"
      HTTP_PROXY: "http://host.docker.internal:7890"
    ports:
      - "8001:8001"
    volumes:
      - ./conf:/app/conf:ro
      - deskwong-settings:/app/data
      - /home/wangcw/.codex:/home/nonroot/.codex:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  deskwong-settings:
