services:
  deskwong-service:
    image: ${DESKWONG_IMAGE:-registry.cn-hangzhou.aliyuncs.com/redgreat/deskwong-service:latest}
    container_name: deskwong-service
    hostname: deskwong-service
    restart: unless-stopped
    pull_policy: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8001:8001"
    volumes:
      - ../conf:/app/conf:ro
      - deskwong-settings:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  deskwong-settings:
